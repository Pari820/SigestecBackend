spring.application.name=sigestec-backend
server.port=8080
# Sin perfil: H2 local para pruebas. Para usar Oracle desde IntelliJ, seleccionar oracle-dev o oracle.
# H2 solamente para desarrollo local. No representa la BD Oracle ADS.
spring.datasource.url=jdbc:h2:file:./sigestec-demo-v2;MODE=Oracle;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=24MB
app.jwt.secret=${JWT_SECRET_BASE64:}
# Duración del token JWT (minutos). Antes: 7200 segundos (120 minutos) en Java.
# Modificar aquí o sobrescribir con JWT_EXPIRACION_MINUTOS en IntelliJ.
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}
app.demo.enabled=${SIGESTEC_DEMO:true}
app.demo.password=${SIGESTEC_DEMO_PASSWORD:Cambiar2026!}
app.storage.directory=${SIGESTEC_STORAGE_DIR:./archivos-sigestec}
app.storage.public-base-url=${SIGESTEC_PUBLIC_BASE_URL:http://localhost:8080}

# Recuperacion mediante SMTP (Gmail es el proveedor de pruebas; no se necesita Brevo).
# Nunca pegar la contrasena de la cuenta Gmail en este archivo o en Git.
# Para Gmail usa contrasena de aplicacion (verificacion en dos pasos), NO tu clave de Gmail.
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000
app.correo.smtp.remitente-email=${SMTP_REMITENTE_EMAIL:${SMTP_USERNAME:}}
app.correo.smtp.remitente-nombre=${SMTP_REMITENTE_NOMBRE:SIGESTEC}

# Recuperacion, deshabilitada por defecto salvo en oracle-dev.
app.recuperacion.enabled=${SIGESTEC_RECUPERACION_ENABLED:false}
app.recuperacion.test-mode=false
app.recuperacion.test-recipient=
app.recuperacion.frontend-url=${SIGESTEC_FRONTEND_URL:http://localhost:4200}
app.recuperacion.ttl-minutos=15
