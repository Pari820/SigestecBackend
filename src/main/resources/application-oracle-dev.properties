# PERFIL EXCLUSIVO PARA DESARROLLO LOCAL EN UNA BD ORACLE DE PRUEBAS.
# IntelliJ -> Run/Debug Configurations -> Active profiles: oracle-dev
# Requiere que Oracle exista y que el usuario ya tenga privilegios de creacion.
# No utilices este perfil sobre el esquema ADS real ni sobre datos importantes.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USER:SIGESTEC_ADS}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# SOLO EN ESQUEMA LOCAL DE PRUEBAS: crea tablas faltantes segun las 36 entidades JPA.
# No elimina las tablas al detener IntelliJ. NO reemplaza scripts/migraciones ADS.
spring.jpa.hibernate.ddl-auto=update

# Evita insertar cuentas/datos demo sin autorizacion explicita.
# Para un esquema local VACIO, activar solo si es indispensable.
app.demo.enabled=${SIGESTEC_DEMO:false}

# SOLO PARA PRUEBAS LOCALES. Los enlaces de TODAS las cuentas demo van a una única casilla.
# No utilizar esta modalidad en producción ni en un servidor accesible públicamente.
app.recuperacion.enabled=${SIGESTEC_RECUPERACION_ENABLED:true}
app.recuperacion.test-mode=true
app.recuperacion.test-recipient=${SIGESTEC_RECUPERACION_CORREO_PRUEBA:sigestec835@gmail.com}
